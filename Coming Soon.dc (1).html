<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200;12..96,300&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>body{margin:0;background:#000}@keyframes reveal{from{opacity:0;filter:blur(18px);transform:scale(.96)}to{opacity:1;filter:none;transform:none}}@keyframes fade{from{opacity:0}to{opacity:1}}@keyframes breathe{50%{opacity:.5;transform:translate(-50%,-50%) scale(1.08)}}@keyframes line{from{transform:scaleX(0)}to{transform:scaleX(1)}}</style>
</helmet>
<div style="min-height:100vh;background:#000;position:relative;isolation:isolate;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(20px,5vh,56px);padding:72px 24px;box-sizing:border-box;font-family:'Bricolage Grotesque',sans-serif">
  <div style="position:absolute;z-index:-1;left:50%;top:44%;width:min(1100px,150vw);height:min(1100px,150vw);transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(245,169,27,.16) 0%,rgba(245,169,27,.04) 35%,rgba(0,0,0,0) 65%);animation:breathe 9s ease-in-out infinite"></div>
  <div style="position:absolute;inset:20px;z-index:-1;border:1px solid rgba(245,169,27,.18);pointer-events:none"></div>


  <div style="width:min(520px,84vw,46vh);aspect-ratio:520/375;overflow:hidden;position:relative;mix-blend-mode:lighten;animation:reveal 2.4s cubic-bezier(.2,.7,.2,1) both"><img src="uploads/mavanga-logo%20final.png" alt="Mavanga" style="position:absolute;width:165.8%;max-width:none;left:-31.7%;top:-26.7%"><div style="position:absolute;left:74.5%;top:0;right:0;height:73%;background:#000;z-index:2"></div></div>

  <div style="width:min(360px,60vw);height:1px;background:linear-gradient(90deg,transparent,#F5A91B,transparent);transform-origin:center;animation:line 2s 1.2s both"></div>

  <div style="display:flex;align-items:center;justify-content:center;gap:clamp(14px,3.2vw,40px);font-weight:200;font-size:clamp(34px,7.5vw,88px);letter-spacing:.02em;line-height:1;color:#F4EBD9;font-variant-numeric:tabular-nums;animation:fade 2s 1.6s both">
    <sc-for list="{{ parts }}" as="p" hint-placeholder-count="7">
      <span style="{{ p.style }}">{{ p.t }}</span>
    </sc-for>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;launchDate&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;2026-10-10T10:00:00&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Launch&quot;}}">
class Component extends DCLogic {
  state = { now: Date.now() };
  componentDidMount() { this.t = setInterval(() => this.setState({ now: Date.now() }), 1000); }
  componentWillUnmount() { clearInterval(this.t); }
  renderVals() {
    const target = new Date(this.props.launchDate ?? '2026-10-10T10:00:00').getTime();
    const d = Math.max(0, target - this.state.now), p = n => String(n).padStart(2, '0');
    const v = [Math.floor(d / 864e5), Math.floor(d / 36e5) % 24, Math.floor(d / 6e4) % 60, Math.floor(d / 1e3) % 60].map(p);
    const parts = [];
    v.forEach((n, i) => { if (i) parts.push({ t: '•', style: 'font-size:.28em;color:#F5A91B' }); parts.push({ t: n, style: 'min-width:1.2em;text-align:center' + (i === 3 ? ';color:#F5A91B' : '') }); });
    return { parts };
  }
}
</script>
</body>
</html>
