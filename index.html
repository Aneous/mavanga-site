<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mavanga</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200;12..96,300&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#000}
@keyframes reveal{from{opacity:0;filter:blur(18px);transform:scale(.96)}to{opacity:1;filter:none;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes breathe{50%{opacity:.5;transform:translate(-50%,-50%) scale(1.08)}}
@keyframes line{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.page{min-height:100vh;background:#000;position:relative;isolation:isolate;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(20px,5vh,56px);padding:72px 24px;box-sizing:border-box;font-family:'Bricolage Grotesque',sans-serif}
.glow{position:absolute;z-index:-1;left:50%;top:44%;width:min(1100px,150vw);height:min(1100px,150vw);transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(245,169,27,.16) 0%,rgba(245,169,27,.04) 35%,rgba(0,0,0,0) 65%);animation:breathe 9s ease-in-out infinite}
.frame{position:absolute;inset:20px;z-index:-1;border:1px solid rgba(245,169,27,.18);pointer-events:none}
.logo{width:min(812.5px,calc(100vw - 48px),71.875vh);aspect-ratio:520/375;overflow:hidden;position:relative;mix-blend-mode:lighten;animation:reveal 2.4s cubic-bezier(.2,.7,.2,1) both}
.logo img{position:absolute;width:165.8%;max-width:none;left:-31.7%;top:-26.7%}
.logo .mask{position:absolute;left:74.5%;top:0;right:0;height:73%;background:#000;z-index:2}
.divider{width:min(360px,60vw);height:1px;background:linear-gradient(90deg,transparent,#F5A91B,transparent);transform-origin:center;animation:line 2s 1.2s both}
.countdown{display:flex;align-items:center;justify-content:center;gap:clamp(10.5px,2.4vw,30px);font-weight:200;font-size:clamp(25.5px,5.625vw,66px);letter-spacing:.02em;line-height:1;color:#F4EBD9;font-variant-numeric:tabular-nums;animation:fade 2s 1.6s both}
.num{min-width:1.2em;text-align:center}
.num.sec{color:#F5A91B}
.dot{font-size:.28em;color:#F5A91B}
</style>
</head>
<body>
<div class="page">
  <div class="glow"></div>
  <div class="frame"></div>
  <div class="logo"><img src="uploads/mavanga-logo-final.png" alt="Mavanga"><div class="mask"></div></div>
  <div class="divider"></div>
  <div class="countdown" id="countdown" aria-label="Countdown to launch">
    <span class="num">00</span><span class="dot">•</span>
    <span class="num">00</span><span class="dot">•</span>
    <span class="num">00</span><span class="dot">•</span>
    <span class="num sec">00</span>
  </div>
</div>
<script>
(function () {
  var target = new Date('2026-10-10T10:00:00').getTime();
  var nums = document.querySelectorAll('#countdown .num');
  var pad = function (n) { return String(n).padStart(2, '0'); };
  function tick() {
    var d = Math.max(0, target - Date.now());
    var v = [Math.floor(d / 864e5), Math.floor(d / 36e5) % 24, Math.floor(d / 6e4) % 60, Math.floor(d / 1e3) % 60];
    for (var i = 0; i < 4; i++) nums[i].textContent = pad(v[i]);
  }
  tick();
  setInterval(tick, 1000);
})();
</script>
</body>
</html>
